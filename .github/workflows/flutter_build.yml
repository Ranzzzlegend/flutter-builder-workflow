name: Flutter Build & Web2APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
        
    - name: Get packages
      run: flutter pub get
      
    - name: Analyze code
      continue-on-error: true
      run: flutter analyze
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Upload APK to Telegram
      if: success()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -F "chat_id=$TELEGRAM_CHAT_ID" \
             -F "document=@build/app/outputs/flutter-apk/app-release.apk" \
             -F "caption=✅ APK BERHASIL DI-BUILD!\n\n📦 Ukuran: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)\n📱 Versi: Release" \
             "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"
             
    - name: Send error to Telegram
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # Ambil log error
        cat build/app/outputs/flutter-apk/*.log 2>/dev/null || true
        cat flutter_analyze_log.txt 2>/dev/null || true
        
        # Kirim pesan error ke Telegram
        curl -F "chat_id=$TELEGRAM_CHAT_ID" \
             -F "text=❌ BUILD GAGAL!\n\n📝 Error: Proses build APK gagal\n🔧 Sistem auto-fix akan memperbaiki" \
             "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
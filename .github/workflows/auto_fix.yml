name: Auto Fix Build

on:
  workflow_run:
    workflows: ["Flutter Build & Web2APK"]
    types: [completed]
    branches: [main]

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
        
    - name: Get packages
      run: flutter pub get
      
    - name: Ambil dan Analisis Log Error
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "📥 Mengambil log error..."
        
        # Download logs dari workflow yang gagal
        curl -sL \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/logs" \
          -o logs.txt || true
          
        # Ekstrak error yang relevan
        grep -E "Error:|error:|Exception" logs.txt > errors.txt || true
        
        echo "📊 ERROR LOG:"
        cat errors.txt || true
        echo "====================================="
        
        # === ANALISIS DAN PERBAIKAN OTOMATIS ===
        
        # 1. FIX: FaIconData vs IconData
        if grep -q "FaIconData" errors.txt; then
          echo "🔧 FIX 1: Mengganti Icon(FontAwesomeIcons) ke FaIcon(FontAwesomeIcons)..."
          
          # Scan semua file dart
          find lib/ -name "*.dart" -exec sed -i \
            's/Icon(FontAwesomeIcons\./FaIcon(FontAwesomeIcons\./g' {} +
          
          # Fix parameter type
          find lib/ -name "*.dart" -exec sed -i \
            's/required IconData icon/required FaIconData icon/g' {} +
          find lib/ -name "*.dart" -exec sed -i \
            's/required IconData? icon/required FaIconData? icon/g' {} +
          find lib/ -name "*.dart" -exec sed -i \
            's/IconData icon/FaIconData icon/g' {} +
          
          echo "✅ FIX 1 BERHASIL"
        fi
        
        # 2. FIX: Missing Import
        if grep -q "isn't defined" errors.txt; then
          echo "🔧 FIX 2: Menambahkan import yang hilang..."
          
          # Ekstrak class yang hilang
          MISSING_CLASS=$(grep -oP "isn't defined\s+'\K(\w+)" errors.txt | head -1)
          
          # Tambahkan import di semua file yang menggunakan class tersebut
          find lib/ -name "*.dart" -exec grep -l "class $MISSING_CLASS" {} \; | head -1 | while read -r CLASS_FILE; do
            CLASS_NAME=$(basename "$CLASS_FILE" .dart)
            find lib/ -name "*.dart" -exec sed -i \
              "s/import 'dart:async';/import 'dart:async';\nimport '$CLASS_NAME.dart';/g" {} +
          done
          
          echo "✅ FIX 2 BERHASIL"
        fi
        
        # 3. FIX: Type Mismatch
        if grep -q "can't be assigned to parameter type" errors.txt; then
          echo "🔧 FIX 3: Memperbaiki type mismatch..."
          
          # Ambil file yang error
          ERROR_FILE=$(grep -oP "^lib/\S+\.dart" errors.txt | head -1)
          
          if [ -n "$ERROR_FILE" ]; then
            # Perbaiki semua IconData menjadi FaIconData
            sed -i 's/IconData/FaIconData/g' "$ERROR_FILE"
            echo "✅ FIX 3 BERHASIL di $ERROR_FILE"
          fi
        fi
        
        # 4. FIX: Syntax Error
        if grep -q "Expected" errors.txt; then
          echo "🔧 FIX 4: Memperbaiki syntax error..."
          
          # Ambil file dan line yang error
          ERROR_LINE=$(grep -oP "Expected.*\K(.*)" errors.txt | head -1)
          ERROR_FILE=$(grep -oP "^lib/\S+\.dart" errors.txt | head -1)
          
          if [ -n "$ERROR_FILE" ]; then
            echo "⚠️ Perlu review manual untuk $ERROR_FILE"
          fi
        fi
        
        # 5. FIX: Pubspec Dependency
        if grep -q "pub get failed" errors.txt; then
          echo "🔧 FIX 5: Memperbaiki pubspec.yaml..."
          
          # Update font_awesome_flutter
          sed -i 's/font_awesome_flutter:.*/font_awesome_flutter: ^11.0.0/g' pubspec.yaml
          
          echo "✅ FIX 5 BERHASIL"
        fi
        
        # 6. FIX: Clean Build Issues
        if grep -q "Gradle task" errors.txt; then
          echo "🔧 FIX 6: Membersihkan cache build..."
          
          # Clear Flutter dan Gradle cache
          flutter clean || true
          cd android
          ./gradlew clean || true
          cd ..
          
          echo "✅ FIX 6 BERHASIL"
        fi
        
        # 7. FIX: File Missing
        if grep -q "File not found" errors.txt; then
          echo "🔧 FIX 7: Membuat file yang hilang..."
          
          # Cek file yang hilang dan buat placeholder
          MISSING_FILE=$(grep -oP "File not found: '\K[^']+" errors.txt | head -1)
          
          if [ -n "$MISSING_FILE" ]; then
            mkdir -p "$(dirname "$MISSING_FILE")"
            echo "// Auto-generated by X-WORM Bot" > "$MISSING_FILE"
            echo "✅ FIX 7 BERHASIL untuk $MISSING_FILE"
          fi
        fi
        
        echo "====================================="
        echo "✅ Semua perbaikan selesai!"
        
    - name: Commit dan Push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.email "bot@xworm.com"
        git config --global user.name "X-WORM Bot"
        
        git add .
        git commit -m "🤖 Auto-fix: Perbaikan build otomatis" || echo "Tidak ada perubahan"
        git push origin main || echo "Push gagal"
        
    - name: Kirim notifikasi ke Telegram
      if: success()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -F "chat_id=$TELEGRAM_CHAT_ID" \
             -F "text=🔧 PERBAIKAN SUKSES!\n\n✅ Code telah diperbaiki\n🔄 Build ulang sedang dijalankan..." \
             "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
             
    - name: Re-trigger build
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Trigger workflow build ulang
        curl -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/flutter_build.yml/dispatches" \
          -d '{"ref":"main"}' || true
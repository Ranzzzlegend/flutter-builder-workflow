name: Build VANTA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install Gradle 8.14.3 Globally
        run: |
          sudo wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          sudo unzip -q gradle-8.14.3-bin.zip -d /opt/
          sudo chmod +x /opt/gradle-8.14.3/bin/gradle
          echo "Gradle Installed!"

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Override Local Gradlew (Anti Permission Denied)
        run: |
          # Ganti gradlew lokal dengan pemanggil Gradle global
          cat > android/gradlew << 'EOF'
          #!/bin/bash
          exec /opt/gradle-8.14.3/bin/gradle "$@"
          EOF
          chmod +x android/gradlew

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

name: Flutter Build & Web2APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build (debug, release, web2apk, generic)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - web2apk
          - generic
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name (untuk Flutter)'
        required: false
        default: 'com.example.app'
      source_zip_url:
        description: 'URL ZIP project Flutter'
        required: false
        default: ''
      url:
        description: 'URL Website (untuk web2apk)'
        required: false
        default: ''
      icon_url:
        description: 'URL Icon (untuk web2apk)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies (web2apk)
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk gradle
          wget -q -O web2apk.zip https://github.com/GoogleChromeLabs/web2apk/releases/latest/download/web2apk.zip
          unzip web2apk.zip -d web2apk
          chmod +x web2apk/web2apk

      - name: Download Flutter project ZIP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          wget -O project.zip "${{ github.event.inputs.source_zip_url }}"
          unzip project.zip -d project
          ls -la project/

      # ===== PERBAIKAN UTAMA: Fix pubspec.yaml dengan AMAN =====
      - name: Fix pubspec.yaml (AUTO-FIX - CRITICAL)
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 MEMPERBAIKI pubspec.yaml..."
          cp pubspec.yaml pubspec.yaml.bak
          
          # ============================================
          # FIX 1: Perbaiki environment section dengan PYTHON
          # ============================================
          python3 << 'PYTHON_SCRIPT'
import re
import sys

try:
    with open('pubspec.yaml', 'r') as f:
        content = f.read()
    
    # Fix environment section
    # Hapus semua environment: yang ada
    content = re.sub(r'^environment:.*$', '', content, flags=re.MULTILINE)
    content = re.sub(r'^  sdk:.*$', '', content, flags=re.MULTILINE)
    content = re.sub(r'^  flutter:.*$', '', content, flags=re.MULTILINE)
    
    # Bersihkan baris kosong ganda
    content = re.sub(r'\n\s*\n\s*\n', '\n\n', content)
    
    # Tambahkan environment yang benar setelah name dan description
    lines = content.split('\n')
    new_lines = []
    env_added = False
    
    for line in lines:
        new_lines.append(line)
        # Tambahkan environment setelah description atau version
        if not env_added and (line.startswith('description:') or line.startswith('version:')):
            new_lines.append('environment:')
            new_lines.append('  sdk: ">=3.0.0 <4.0.0"')
            new_lines.append('  flutter: ">=3.0.0"')
            env_added = True
    
    if not env_added:
        # Kalau tidak ketemu, tambahkan setelah name:
        for i, line in enumerate(new_lines):
            if line.startswith('name:'):
                new_lines.insert(i+1, 'environment:')
                new_lines.insert(i+2, '  sdk: ">=3.0.0 <4.0.0"')
                new_lines.insert(i+3, '  flutter: ">=3.0.0"')
                break
    
    content = '\n'.join(new_lines)
    
    # Bersihkan dependency_overrides yang lama
    content = re.sub(r'^dependency_overrides:.*$', '', content, flags=re.MULTILINE)
    content = re.sub(r'^  [a-zA-Z_]+:.*$', '', content, flags=re.MULTILINE)
    
    # Hapus semua baris kosong ganda lagi
    content = re.sub(r'\n\s*\n\s*\n', '\n\n', content)
    
    with open('pubspec.yaml', 'w') as f:
        f.write(content)
    
    print("✅ Environment section fixed!")
    
except Exception as e:
    print(f"❌ Error: {e}")
    sys.exit(1)
PYTHON_SCRIPT

          # ============================================
          # FIX 2: Upgrade dependencies dengan PYTHON
          # ============================================
          python3 << 'PYTHON_SCRIPT'
import re
import sys

try:
    with open('pubspec.yaml', 'r') as f:
        content = f.read()
    
    # Upgrade dependencies ke versi terbaru
    replacements = {
        r'flutter_lints:.*': 'flutter_lints: ^5.0.0',
        r'font_awesome_flutter:.*': 'font_awesome_flutter: ^10.7.0',
        r'package_info_plus:.*': 'package_info_plus: ^8.0.0',
        r'share_plus:.*': 'share_plus: ^10.1.0',
        r'cupertino_icons:.*': 'cupertino_icons: ^1.0.8',
        r'http:.*': 'http: ^1.2.2',
        r'dio:.*': 'dio: ^5.7.0',
        r'youtube_player_flutter:.*': 'youtube_player_flutter: ^9.0.0',
        r'flutter_inappwebview:.*': 'flutter_inappwebview: ^6.1.5',
    }
    
    for pattern, replacement in replacements.items():
        content = re.sub(rf'^(\s*){pattern}$', rf'\1{replacement}', content, flags=re.MULTILINE)
    
    with open('pubspec.yaml', 'w') as f:
        f.write(content)
    
    print("✅ Dependencies upgraded!")
    
except Exception as e:
    print(f"❌ Error: {e}")

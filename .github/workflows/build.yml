          # ============================================
          # FIX 3: Tambahkan dependency_overrides dengan PYTHON
          # ============================================
          python3 << 'PYTHON_SCRIPT'
import sys

try:
    with open('pubspec.yaml', 'r') as f:
        content = f.read()
    
    # Hapus dependency_overrides yang sudah ada
    lines = content.split('\n')
    new_lines = []
    skip = False
    in_dep_overrides = False
    
    for line in lines:
        if line.strip() == 'dependency_overrides:':
            in_dep_overrides = True
            continue
        if in_dep_overrides and (line.startswith('  ') or line.strip() == ''):
            continue
        if in_dep_overrides and not line.startswith('  '):
            in_dep_overrides = False
        
        new_lines.append(line)
    
    content = '\n'.join(new_lines)
    
    # Tambahkan dependency_overrides di akhir file
    dep_overrides = """
dependency_overrides:
  flutter_lints: ^5.0.0
  font_awesome_flutter: ^10.7.0
  package_info_plus: ^8.0.0
  share_plus: ^10.1.0
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  dio: ^5.7.0
  web: ^1.0.0
  youtube_player_flutter: ^9.0.0
  flutter_inappwebview: ^6.1.5
"""
    
    content += dep_overrides
    
    with open('pubspec.yaml', 'w') as f:
        f.write(content)
    
    print("✅ Dependency overrides added!")
    
except Exception as e:
    print(f"❌ Error: {e}")
    sys.exit(1)

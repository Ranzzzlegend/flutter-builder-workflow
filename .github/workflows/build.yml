name: Flutter Build and Web2APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - web2apk
          - generic
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.example.app'
      source_zip_url:
        description: 'URL ZIP project'
        required: false
        default: ''
      url:
        description: 'URL Website'
        required: false
        default: ''
      icon_url:
        description: 'URL Icon'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ========== WEB2APK PATH ==========
      - name: Install web2apk dependencies
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip gradle
          wget -q -O web2apk.zip https://github.com/GoogleChromeLabs/web2apk/releases/latest/download/web2apk.zip || echo "skip"
          if [ -f web2apk.zip ]; then unzip -o web2apk.zip -d web2apk; chmod +x web2apk/web2apk || true; fi

      - name: Web2APK Build
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          if [ -f web2apk/web2apk ]; then
            ./web2apk/web2apk --url "${{ github.event.inputs.url }}" --name "${{ github.event.inputs.app_name }}" --package "${{ github.event.inputs.package_name }}" --icon "${{ github.event.inputs.icon_url }}" --output webapp.apk || echo "web2apk failed"
          else
            echo "web2apk binary missing"
            touch webapp.apk
          fi
        continue-on-error: true

      # ========== FLUTTER BUILD PATH ==========
      - name: Download Flutter project ZIP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          wget -O project.zip "${{ github.event.inputs.source_zip_url }}"
          mkdir -p project
          unzip -o project.zip -d project > /dev/null
          if [ ! -f "project/pubspec.yaml" ]; then
            SUB=$(find project -maxdepth 3 -name pubspec.yaml -type f | head -1 | xargs dirname 2>/dev/null)
            if [ -n "$SUB" ] && [ "$SUB" != "project" ]; then
              shopt -s dotglob
              mv "$SUB"/* project/ 2>/dev/null || true
              shopt -u dotglob
            fi
          fi
          echo "=== Project folder ==="
          ls -la project/
          echo ""
          echo "=== pubspec.yaml ASLI (sebelum patch) ==="
          cat project/pubspec.yaml || true

      # ========== STEP AUTO-PATCH ==========
      - name: Auto-patch project (hapus lock + force packages)
        id: patch
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 Auto-patch project..."
          if [ -f "pubspec.lock" ]; then
            echo "🗑️  Hapus pubspec.lock (paksa resolve ulang)..."
            rm -f pubspec.lock
          fi
          rm -rf .dart_tool 2>/dev/null || true

      # ========== STEP DETECT Flutter version ==========
      - name: Detect Flutter version from pubspec
        id: detect
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          if [ ! -f "project/pubspec.yaml" ]; then
            echo "fv=3.24.5" >> $GITHUB_OUTPUT
            exit 0
          fi
          SDK=$(grep -E '^[[:space:]]+sdk:' project/pubspec.yaml | head -1 | sed 's/.*sdk:[[:space:]]*//' | tr -d '"' | tr -d "'" | tr -d ' ')
          echo "SDK: [$SDK]"
          MIN=$(echo "$SDK" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          if [ -z "$MIN" ]; then MIN="3.5.0"; fi
          echo "Min SDK: $MIN"
          MAJOR=$(echo "$MIN" | cut -d. -f1)
          MINOR=$(echo "$MIN" | cut -d. -f2)
          FLUTTER="3.24.5"
          if [ "$MAJOR" -ge 4 ]; then FLUTTER="3.47.5"
          elif [ "$MAJOR" -eq 3 ]; then
            if [ "$MINOR" -ge 10 ]; then FLUTTER="3.47.5"
            elif [ "$MINOR" -ge 9 ]; then FLUTTER="3.41.5"
            elif [ "$MINOR" -ge 8 ]; then FLUTTER="3.35.5"
            elif [ "$MINOR" -ge 7 ]; then FLUTTER="3.29.3"
            elif [ "$MINOR" -ge 6 ]; then FLUTTER="3.27.4"
            elif [ "$MINOR" -ge 5 ]; then FLUTTER="3.24.5"
            else FLUTTER="3.22.3"
            fi
          fi
          echo "Detected Flutter: $FLUTTER"
          echo "fv=$FLUTTER" >> $GITHUB_OUTPUT

      - name: Setup Flutter detected version
        id: s1
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.detect.outputs.fv }}
          channel: stable
          cache: true

      - name: Show Flutter version
        if: steps.s1.outcome == 'success'
        run: flutter --version

      # ========== STEP PUB GET ==========
      - name: Pub get attempt 1
        id: pg1
        if: steps.s1.outcome == 'success'
        working-directory: project
        continue-on-error: true
        run: flutter pub get

      - name: Setup Flutter latest stable
        id: s2
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != '' && steps.pg1.outcome != 'success'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get attempt 2
        id: pg2
        if: steps.s2.outcome == 'success'
        working-directory: project
        continue-on-error: true
        run: flutter pub get

      - name: Setup Flutter beta channel
        id: s3
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != '' && steps.pg1.outcome != 'success' && steps.pg2.outcome != 'success'
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Pub get attempt 3
        id: pg3
        if: steps.s3.outcome == 'success'
        working-directory: project
        run: flutter pub get

      # ==================== SOLUSI UTAMA: INSTALL GRADLE GLOBAL ====================
      - name: Install Gradle 8.14.3 globally with proper permissions
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != '' && (steps.pg1.outcome == 'success' || steps.pg2.outcome == 'success' || steps.pg3.outcome == 'success')
        run: |
          echo "🔧 Menginstall Gradle 8.14.3 secara global..."
          cd /tmp
          wget -q "https://services.gradle.org/distributions/gradle-8.14.3-bin.zip" -O gradle.zip
          ls -la gradle.zip
          unzip -q gradle.zip
          sudo mkdir -p /opt/gradle
          sudo mv gradle-8.14.3 /opt/gradle/
          sudo chmod -R 755 /opt/gradle/gradle-8.14.3/
          sudo chmod +x /opt/gradle/gradle-8.14.3/bin/gradle
          
          echo "✅ Verifikasi Gradle global:"
          ls -la /opt/gradle/gradle-8.14.3/bin/gradle
          /opt/gradle/gradle-8.14.3/bin/gradle --version
      # ==============================================================================

      # ==================== OVERRIDE gradlew ====================
      - name: Override gradlew with system gradle wrapper
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != '' && (steps.pg1.outcome == 'success' || steps.pg2.outcome == 'success' || steps.pg3.outcome == 'success')
        working-directory: project
        run: |
          echo "🔧 Mengganti gradlew dengan script pemanggil Gradle global..."
          
          # Backup gradlew asli
          if [ -f "android/gradlew" ]; then
            cp android/gradlew android/gradlew.bak
          fi
          
          # Buat script gradlew baru
          cat > android/gradlew << 'GRADLEW_EOF'
          #!/bin/bash
          exec /opt/gradle/gradle-8.14.3/bin/gradle "$@"
          GRADLEW_EOF
          
          chmod +x android/gradlew
          
          echo "✅ Verifikasi gradlew baru:"
          cat android/gradlew
          ls -la android/gradlew
      # ==========================================================

      # ========== STEP GRADLE ADAPTIVE ==========
      - name: Setup Gradle and AGP adaptive
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != '' && (steps.pg1.outcome == 'success' || steps.pg2.outcome == 'success' || steps.pg3.outcome == 'success')
        working-directory: project
        run: |
          echo "📦 Memastikan AGP version yang kompatibel..."
          
          if [ -f "android/build.gradle" ]; then
            sed -i "s|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.9.1|g" android/build.gradle
          fi
          if [ -f "android/build.gradle.kts" ]; then
            sed -i "s|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.9.1|g" android/build.gradle.kts
            sed -i "s|id(\"com.android.application\") version \"[0-9.]*\"|id(\"com.android.application\") version \"8.9.1\"|g" android/build.gradle.kts 2>/dev/null || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            grep -q "namespace" android/app/build.gradle || sed -i '/android {/a\    namespace "com.example.app"' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            grep -q "namespace" android/app/build.gradle.kts || sed -i '/android {/a\    namespace("com.example.app")' android/app/build.gradle.kts
          fi
          if [ -f "android/gradle.properties" ]; then
            grep -q "android.useAndroidX" android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
            grep -q "android.enableJetifier" android/gradle.properties || echo "android.enableJetifier=true" >> android/gradle.properties
          fi

      # ==================== FIX VERSIONCODE ====================
      - name: Patch app/build.gradle version code
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != '' && (steps.pg1.outcome == 'success' || steps.pg2.outcome == 'success' || steps.pg3.outcome == 'success')
        working-directory: project
        run: |
          echo "🔧 Memperbaiki versionCode dan versionName..."
          sed -i 's/versionCode flutter\.versionCode/versionCode 1/g' android/app/build.gradle
          sed -i 's/versionName flutter\.versionName/versionName "1.0.0"/g' android/app/build.gradle
          sed -i 's/versionCode flutterVersionCode\.toInteger()/versionCode 1/g' android/app/build.gradle
          sed -i 's/versionName flutterVersionName/versionName "1.0.0"/g' android/app/build.gradle
          sed -i '/flutter\.versionCode/d' android/app/build.gradle
          sed -i '/flutter\.versionName/d' android/app/build.gradle
          echo "✅ Perbaikan versionCode selesai."

      # ========== BUILD APK ==========
      - name: Build APK Debug
        if: github.event.inputs.build_type == 'debug' && github.event.inputs.source_zip_url != '' && (steps.pg1.outcome == 'success' || steps.pg2.outcome == 'success' || steps.pg3.outcome == 'success')
        working-directory: project
        run: flutter build apk --debug --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Build APK Release
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'generic') && github.event.inputs.source_zip_url != '' && (steps.pg1.outcome == 'success' || steps.pg2.outcome == 'success' || steps.pg3.outcome == 'success')
        working-directory: project
        run: flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      # ========== UPLOAD ARTIFACT ==========
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            project/build/app/outputs/flutter-apk/*.apk
            webapp.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -rf project web2apk webapp.apk project.zip /tmp/gradle* || true
name: Flutter Build & Web2APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build (debug, release, web2apk, generic)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - web2apk
          - generic
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name (untuk Flutter)'
        required: false
        default: 'com.example.app'
      source_zip_url:
        description: 'URL ZIP project Flutter'
        required: false
        default: ''
      url:
        description: 'URL Website (untuk web2apk)'
        required: false
        default: ''
      icon_url:
        description: 'URL Icon (untuk web2apk)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.22.0
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies (web2apk)
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk gradle
          wget -q -O web2apk.zip https://github.com/GoogleChromeLabs/web2apk/releases/latest/download/web2apk.zip
          unzip web2apk.zip -d web2apk
          chmod +x web2apk/web2apk

      - name: Download Flutter project ZIP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          wget -O project.zip "${{ github.event.inputs.source_zip_url }}"
          unzip project.zip -d project
          ls -la project/

      # ===== PERBAIKAN: Fix pubspec.yaml =====
      - name: Fix pubspec.yaml (AUTO-FIX)
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 MEMPERBAIKI pubspec.yaml..."
          cp pubspec.yaml pubspec.yaml.bak
          
          sed -i '/dependency_overrides:/d' pubspec.yaml
          sed -i 's/dependency_overrides://g' pubspec.yaml
          sed -i '/^$/d' pubspec.yaml
          
          sed -i 's|flutter_lints:.*|flutter_lints: ^4.0.0|g' pubspec.yaml
          sed -i 's|font_awesome_flutter:.*|font_awesome_flutter: ^10.6.0|g' pubspec.yaml
          sed -i 's|package_info_plus:.*|package_info_plus: ^5.0.0|g' pubspec.yaml
          sed -i 's|share_plus:.*|share_plus: ^10.0.0|g' pubspec.yaml
          
          if grep -q "youtube_player_flutter" pubspec.yaml; then
            sed -i 's|youtube_player_flutter:.*|youtube_player_flutter: ^8.1.0|g' pubspec.yaml
          fi
          if grep -q "flutter_inappwebview" pubspec.yaml; then
            sed -i 's|flutter_inappwebview:.*|flutter_inappwebview: ^5.7.0|g' pubspec.yaml
          fi
          
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  flutter_lints: ^4.0.0" >> pubspec.yaml
          echo "  font_awesome_flutter: ^10.6.0" >> pubspec.yaml
          echo "  package_info_plus: ^5.0.0" >> pubspec.yaml
          echo "  share_plus: ^10.0.0" >> pubspec.yaml
          echo "  web: ^0.5.0" >> pubspec.yaml
          if grep -q "youtube_player_flutter" pubspec.yaml; then
            echo "  youtube_player_flutter: ^8.1.0" >> pubspec.yaml
          fi
          if grep -q "flutter_inappwebview" pubspec.yaml; then
            echo "  flutter_inappwebview: ^5.7.0" >> pubspec.yaml
          fi

      # ===== PERBAIKAN: Auto-fix source code =====
      - name: Auto-fix Dart source code errors
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 MEMPERBAIKI SOURCE CODE..."
          for file in lib/*.dart; do
            if [ -f "$file" ]; then
              sed -i 's/FontAwesomeIcons\.userEdit/Icons.edit/g' "$file"
              sed -i 's/FontAwesomeIcons\.calendarPlus/Icons.calendar_today/g' "$file"
              sed -i 's/FontAwesomeIcons\.calendarDay/Icons.calendar_month/g' "$file"
              sed -i 's/FontAwesomeIcons\.clock/Icons.timer/g' "$file"
              sed -i 's/FontAwesomeIcons\.users/Icons.people/g' "$file"
              sed -i 's/FontAwesomeIcons\.userPlus/Icons.person_add/g' "$file"
              sed -i 's/FontAwesomeIcons\.userSlash/Icons.person_remove/g' "$file"
              sed -i 's/FontAwesomeIcons\.user/Icons.person/g' "$file"
              sed -i 's/FontAwesomeIcons\.lock/Icons.lock/g' "$file"
              sed -i 's/FontAwesomeIcons\.whatsapp/Icons.whatsapp/g' "$file"
              sed -i 's/FontAwesomeIcons\.telegram/Icons.telegram/g' "$file"
              sed -i 's/FontAwesomeIcons\.tiktok/Icons.music_note/g' "$file"
              sed -i 's/FontAwesomeIcons\.rocket/Icons.rocket_launch/g' "$file"
              sed -i 's/FontAwesomeIcons\.userAstronaut/Icons.person/g' "$file"
            fi
          done

      # ================================================================
      # ===== PERBAIKAN: Fix build.gradle.kts =====
      # ================================================================
      - name: Fix build.gradle.kts (FIX KOTLIN DSL)
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 MEMPERBAIKI build.gradle.kts..."
          
          # Fix android/app/build.gradle.kts
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "📦 Memperbaiki android/app/build.gradle.kts..."
            
            # Fix versionCode = flutter.versionCode → versionCode = flutter.versionCode()
            sed -i 's/versionCode = flutter\.versionCode/versionCode = flutter.versionCode()/g' android/app/build.gradle.kts
            sed -i 's/versionName = flutter\.versionName/versionName = flutter.versionName()/g' android/app/build.gradle.kts
            
            # Fix defaultConfig
            sed -i 's/flutter\.versionCode/flutter.versionCode()/g' android/app/build.gradle.kts
            sed -i 's/flutter\.versionName/flutter.versionName()/g' android/app/build.gradle.kts
            
            echo "📄 android/app/build.gradle.kts setelah perbaikan:"
            cat android/app/build.gradle.kts | head -50
          fi
          
          # Fix android/build.gradle.kts jika ada
          if [ -f "android/build.gradle.kts" ]; then
            echo "📦 Memperbaiki android/build.gradle.kts..."
            sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.5.2/g' android/build.gradle.kts
          fi
          
          # Jika ada build.gradle (non-kts), perbaiki juga
          if [ -f "android/app/build.gradle" ]; then
            echo "📦 Memperbaiki android/app/build.gradle..."
            grep -q "namespace" android/app/build.gradle || sed -i '/android {/a\    namespace "com.example.app"' android/app/build.gradle
          fi

      # ================================================================
      # ===== Get dependencies =====
      # ================================================================
      - name: Get Flutter dependencies
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter pub get || (rm -f pubspec.lock && flutter pub get)

      # ================================================================
      # ===== Upgrade Gradle =====
      # ================================================================
      - name: Upgrade Gradle wrapper
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      # ================================================================
      # ===== Build APK =====
      # ================================================================
      - name: Build APK (Release)
        if: github.event.inputs.build_type == 'release' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            project/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Cleanup
        run: rm -rf project web2apk webapp.apk || true
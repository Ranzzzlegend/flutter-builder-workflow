name: Flutter Build and Web2APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - web2apk
          - generic
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.example.app'
      source_zip_url:
        description: 'URL ZIP project'
        required: false
        default: ''
      url:
        description: 'URL Website'
        required: false
        default: ''
      icon_url:
        description: 'URL Icon'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ========== WEB2APK PATH ==========
      - name: Install web2apk dependencies
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip gradle
          wget -q -O web2apk.zip https://github.com/GoogleChromeLabs/web2apk/releases/latest/download/web2apk.zip || echo "skip"
          if [ -f web2apk.zip ]; then unzip -o web2apk.zip -d web2apk; chmod +x web2apk/web2apk || true; fi

      - name: Web2APK Build
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          if [ -f web2apk/web2apk ]; then
            ./web2apk/web2apk --url "${{ github.event.inputs.url }}" --name "${{ github.event.inputs.app_name }}" --package "${{ github.event.inputs.package_name }}" --icon "${{ github.event.inputs.icon_url }}" --output webapp.apk || echo "web2apk failed"
          else
            echo "web2apk binary missing"
            touch webapp.apk
          fi
        continue-on-error: true

      # ========== FLUTTER BUILD PATH ==========
      - name: Download Flutter project ZIP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          wget -O project.zip "${{ github.event.inputs.source_zip_url }}"
          mkdir -p project
          unzip -o project.zip -d project > /dev/null
          if [ ! -f "project/pubspec.yaml" ]; then
            SUB=$(find project -maxdepth 3 -name pubspec.yaml -type f | head -1 | xargs dirname 2>/dev/null)
            if [ -n "$SUB" ] && [ "$SUB" != "project" ]; then
              shopt -s dotglob
              mv "$SUB"/* project/ 2>/dev/null || true
              shopt -u dotglob
            fi
          fi
          echo "=== Project folder ==="
          ls -la project/
          echo ""
          echo "=== pubspec.yaml ASLI (sebelum patch) ==="
          cat project/pubspec.yaml || true
          echo ""
          echo "=== Cek pubspec.lock ==="
          ls -la project/pubspec.lock 2>/dev/null || echo "Tidak ada pubspec.lock"

      # ========== STEP AUTO-PATCH: Hapus lock + Force package fix ==========
      - name: Auto-patch project (hapus lock + force packages)
        id: patch
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 Auto-patch project..."

          # 1) HAPUS pubspec.lock (paksa resolve ulang)
          if [ -f "pubspec.lock" ]; then
            echo "🗑️  Hapus pubspec.lock (paksa resolve ulang)..."
            rm -f pubspec.lock
          fi

          # 2) Hapus .dart_tool cache jika ada
          rm -rf .dart_tool 2>/dev/null || true

          # 3) FORCE package overrides untuk package yang problematic
          python3 << 'PYEOF'
          import re

          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              content = f.read().replace('\r\n', '\n').replace('\r', '\n')

          # Fixes yang kita mau: exact version (bukan ^)
          fixes = {
              'dynamic_color': '1.7.0',           # 1.9.0+ pakai kotlin{} yang break
              'font_awesome_flutter': '10.9.1',   # fix IconData final class
          }

          lines = content.split('\n')
          result = []
          applied = []

          # Pass 1: override di dependencies section
          for line in lines:
              matched = False
              for pkg, ver in fixes.items():
                  pattern = rf'^(\s{{2}}){re.escape(pkg)}:\s*\S+'
                  m = re.match(pattern, line)
                  if m:
                      result.append(f'  {pkg}: {ver}')
                      applied.append(f'{pkg} → {ver}')
                      matched = True
                      break
              if not matched:
                  result.append(line)

          content = '\n'.join(result)

          # Pass 2: tambahkan dependency_overrides di akhir
          # Hapus dependency_overrides lama kalau ada
          content = re.sub(r'\ndependency_overrides:.*?(?=\n\S|\Z)', '\n', content, flags=re.DOTALL)

          # Append dependency_overrides baru
          override_block = '\ndependency_overrides:\n'
          for pkg, ver in fixes.items():
              override_block += f'  {pkg}: {ver}\n'

          content = content.rstrip() + '\n' + override_block

          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write(content)

          print("✅ Fixes applied:")
          for a in applied:
              print(f"   - {a}")
          print("✅ dependency_overrides ditambahkan")
          PYEOF

          echo ""
          echo "=== pubspec.yaml SETELAH patch ==="
          cat pubspec.yaml

      # ========== STEP DETECT Flutter version ==========
      - name: Detect Flutter version from pubspec
        id: detect
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          if [ ! -f "project/pubspec.yaml" ]; then
            echo "fv=3.29.3" >> $GITHUB_OUTPUT
            exit 0
          fi

          SDK=$(grep -E '^[[:space:]]+sdk:' project/pubspec.yaml | head -1 | sed 's/.*sdk:[[:space:]]*//' | tr -d '"' | tr -d "'" | tr -d ' ')
          echo "SDK: [$SDK]"

          MIN=$(echo "$SDK" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          if [ -z "$MIN" ]; then MIN="3.5.0"; fi
          echo "Min SDK: $MIN"

          MAJOR=$(echo "$MIN" | cut -d. -f1)
          MINOR=$(echo "$MIN" | cut -d. -f2)

          FLUTTER="3.29.3"
          if [ "$MAJOR" -ge 4 ]; then FLUTTER="3.47.5"
          elif [ "$MAJOR" -eq 3 ]; then
            if [ "$MINOR" -ge 10 ]; then FLUTTER="3.47.5"
            elif [ "$MINOR" -ge 9 ]; then FLUTTER="3.41.5"
            elif [ "$MINOR" -ge 8 ]; then FLUTTER="3.35.5"
            elif [ "$MINOR" -ge 7 ]; then FLUTTER="3.29.3"
            elif [ "$MINOR" -ge 6 ]; then FLUTTER="3.27.4"
            elif [ "$MINOR" -ge 5 ]; then FLUTTER="3.24.5"
            else FLUTTER="3.22.3"
            fi
          fi

          echo "Detected Flutter: $FLUTTER"
          echo "fv=$FLUTTER" >> $GITHUB_OUTPUT

      - name: Setup Flutter detected version
        id: s1
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.detect.outputs.fv }}
          channel: stable
          cache: true

      - name: Show Flutter version
        if: steps.s1.outcome == 'success'
        run: flutter --version

      # ========== STEP PUB GET dengan 3-level fallback ==========
      - name: Pub get attempt 1
        id: pg1
        if: steps.s1.outcome == 'success'
        working-directory: project
        continue-on-error: true
        run: flutter pub get

      - name: Setup Flutter latest stable
        id: s2
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != '' && steps.pg1.outcome != 'success'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get attempt 2
        id: pg2
        if: steps.s2.outcome == 'success'
        working-directory: project
        continue-on-error: true
        run: flutter pub get

      - name: Setup Flutter beta channel
        id: s3
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != '' && steps.pg1.outcome != 'success' && steps.pg2.outcome != 'success'
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Pub get attempt 3
        id: pg3
        if: steps.s3.outcome == 'success'
        working-directory: project
        run: flutter pub get

      # ========== VERIFIKASI: cek versi dynamic_color yang ke-resolve ==========
      - name: Verify resolved package versions
        if: (steps.pg1.outcome == 'success' || steps.pg2.outcome == 'success' || steps.pg3.outcome == 'success')
        working-directory: project
        run: |
          echo "=== Cek dynamic_color yang ter-resolve ==="
          grep -A 2 "dynamic_color:" pubspec.lock 2>/dev/null | head -10 || echo "Tidak ditemukan di lock"
          echo ""
          echo "=== Cek font_awesome_flutter yang ter-resolve ==="
          grep -A 2 "font_awesome_flutter:" pubspec.lock 2>/dev/null | head -10 || echo "Tidak ditemukan di lock"

      # ========== STEP GRADLE + AGP adaptive ==========
      - name: Setup Gradle and AGP adaptive
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != '' && (steps.pg1.outcome == 'success' || steps.pg2.outcome == 'success' || steps.pg3.outcome == 'success')
        working-directory: project
        run: |
          FLUTTER_VER=$(flutter --version 2>/dev/null | head -1 | awk '{print $2}')
          echo "Flutter sekarang: $FLUTTER_VER"

          GRADLE_VER="8.11.1"
          AGP_VER="8.7.3"

          FM=$(echo "$FLUTTER_VER" | cut -d. -f1)
          Fm=$(echo "$FLUTTER_VER" | cut -d. -f2)

          if [ "$FM" = "3" ]; then
            if [ "$Fm" -ge 33 ]; then
              GRADLE_VER="8.14.3"; AGP_VER="8.9.1"
            elif [ "$Fm" -ge 28 ]; then
              GRADLE_VER="8.11.1"; AGP_VER="8.7.3"
            elif [ "$Fm" -ge 25 ]; then
              GRADLE_VER="8.9"; AGP_VER="8.5.2"
            else
              GRADLE_VER="8.4"; AGP_VER="8.3.0"
            fi
          fi

          echo "📦 Gradle: $GRADLE_VER, AGP: $AGP_VER"

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i "s|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VER}-all.zip|g" android/gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i "s|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:${AGP_VER}|g" android/build.gradle
          fi
          if [ -f "android/build.gradle.kts" ]; then
            sed -i "s|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:${AGP_VER}|g" android/build.gradle.kts
            sed -i "s|id(\"com.android.application\") version \"[0-9.]*\"|id(\"com.android.application\") version \"${AGP_VER}\"|g" android/build.gradle.kts 2>/dev/null || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            grep -q "namespace" android/app/build.gradle || sed -i '/android {/a\    namespace "com.example.app"' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            grep -q "namespace" android/app/build.gradle.kts || sed -i '/android {/a\    namespace("com.example.app")' android/app/build.gradle.kts
          fi
          if [ -f "android/gradle.properties" ]; then
            grep -q "android.useAndroidX" android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
            grep -q "android.enableJetifier" android/gradle.properties || echo "android.enableJetifier=true" >> android/gradle.properties
          fi
          [ -f "android/gradlew" ] && chmod +x android/gradlew || true

      # ========== BUILD APK ==========
      - name: Build APK Debug
        if: github.event.inputs.build_type == 'debug' && github.event.inputs.source_zip_url != '' && (steps.pg1.outcome == 'success' || steps.pg2.outcome == 'success' || steps.pg3.outcome == 'success')
        working-directory: project
        run: flutter build apk --debug --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Build APK Release
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'generic') && github.event.inputs.source_zip_url != '' && (steps.pg1.outcome == 'success' || steps.pg2.outcome == 'success' || steps.pg3.outcome == 'success')
        working-directory: project
        run: flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      # ========== UPLOAD ARTIFACT ==========
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            project/build/app/outputs/flutter-apk/*.apk
            webapp.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -rf project web2apk webapp.apk project.zip || true
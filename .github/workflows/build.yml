      # ===== Auto-fix Dart source =====
      - name: Auto-fix Dart source code errors
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          # Ganti FontAwesomeIcons yang deprecated
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.userEdit/Icons.edit/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.calendarPlus/Icons.calendar_today/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.calendarDay/Icons.calendar_month/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.clock/Icons.timer/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.users/Icons.people/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.userPlus/Icons.person_add/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.userSlash/Icons.person_remove/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.user/Icons.person/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.lock/Icons.lock/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.whatsapp/Icons.whatsapp/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.telegram/Icons.telegram/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.tiktok/Icons.music_note/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.rocket/Icons.rocket_launch/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/FontAwesomeIcons\.userAstronaut/Icons.person/g' {} \;
          # Perbaiki import material jika perlu
          find lib -name "*.dart" -exec sed -i 's/import '\''package:font_awesome_flutter\/font_awesome_flutter.dart'\'';/\/\/ import '\''package:font_awesome_flutter\/font_awesome_flutter.dart'\'';/g' {} \;

      # ===== FIX build.gradle.kts =====
      - name: Fix build.gradle.kts
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            cp android/app/build.gradle.kts android/app/build.gradle.kts.bak
            sed -i 's/versionCode = flutter\.versionCode/versionCode = flutter.versionCode()/g' android/app/build.gradle.kts
            sed -i 's/versionName = flutter\.versionName/versionName = flutter.versionName()/g' android/app/build.gradle.kts
            sed -i 's/flutter\.versionCode()()/flutter.versionCode()/g' android/app/build.gradle.kts
            sed -i 's/flutter\.versionName()()/flutter.versionName()/g' android/app/build.gradle.kts
            sed -i 's/namespace = "com.example"/namespace = "com.example"/g' android/app/build.gradle.kts
          fi

      # ===== FIX flutter_inappwebview namespace =====
      - name: Fix flutter_inappwebview Namespace
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          INAPPWEBVIEW_PATH=$(find /home/runner/.pub-cache -path "*/flutter_inappwebview-*/android/build.gradle" 2>/dev/null | head -1)
          if [ -n "$INAPPWEBVIEW_PATH" ]; then
            cp "$INAPPWEBVIEW_PATH" "$INAPPWEBVIEW_PATH.bak"
            if ! grep -q "namespace" "$INAPPWEBVIEW_PATH"; then
              echo "namespace \"com.pichillilorenzo.flutter_inappwebview\"" >> "$INAPPWEBVIEW_PATH"
            fi
          fi

      # ===== Get dependencies =====
      - name: Get Flutter dependencies
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter pub get || (rm -f pubspec.lock && flutter pub get)

      # ===== Upgrade Gradle =====
      - name: Upgrade Gradle wrapper
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i 's/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.3.0/g' android/build.gradle
          fi
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/dev.flutter.flutter-plugin-loader/plugins { id "dev.flutter.flutter-plugin-loader" version "1.0.0" }/g' android/settings.gradle
          fi

      # ===== Build APK =====
      - name: Build APK (Release)
        if: github.event.inputs.build_type == 'release' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation || flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            project/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Cleanup
        run: rm -rf project web2apk webapp.apk || true
name: Flutter Build & Web2APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build (debug, release, web2apk, generic)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - web2apk
          - generic
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name (untuk Flutter)'
        required: false
        default: 'com.example.app'
      source_zip_url:
        description: 'URL ZIP project Flutter'
        required: false
        default: ''
      url:
        description: 'URL Website (untuk web2apk)'
        required: false
        default: ''
      icon_url:
        description: 'URL Icon (untuk web2apk)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ===== FIX FINAL: Flutter 3.29.3 =====
      # - Dart 3.7 (IconData BELUM final class → font_awesome_flutter 10.x OK)
      # - Memenuhi syarat font_awesome_flutter 10.9.1 (Flutter >= 3.27.0)
      - name: Setup Flutter 3.29.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies (web2apk)
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip gradle
          wget -q -O web2apk.zip https://github.com/GoogleChromeLabs/web2apk/releases/latest/download/web2apk.zip || echo "skip"
          if [ -f web2apk.zip ]; then unzip -o web2apk.zip -d web2apk; chmod +x web2apk/web2apk || true; fi

      - name: Download Flutter project ZIP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          wget -O project.zip "${{ github.event.inputs.source_zip_url }}"
          mkdir -p project
          unzip -o project.zip -d project > /dev/null
          if [ ! -f "project/pubspec.yaml" ]; then
            SUB=$(find project -maxdepth 3 -name pubspec.yaml -type f | head -1 | xargs dirname 2>/dev/null)
            if [ -n "$SUB" ] && [ "$SUB" != "project" ]; then
              shopt -s dotglob
              mv "$SUB"/* project/ 2>/dev/null || true
              shopt -u dotglob
            fi
          fi
          echo "=== Isi folder project ==="
          ls -la project/
          echo "=== pubspec.yaml ==="
          cat project/pubspec.yaml || true

      - name: Show project pubspec (debug)
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "=== Flutter version used ==="
          flutter --version
          echo ""
          echo "=== pubspec.yaml content ==="
          cat pubspec.yaml

      - name: Get Flutter dependencies
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter pub get || (echo "Retry..." && flutter pub get)

      # ===== Gradle & AGP untuk Flutter 3.29.3 =====
      - name: Upgrade Gradle wrapper & AGP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "📦 Set Gradle 8.11.1 untuk Flutter 3.29.3..."
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
            cat android/gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f "android/build.gradle" ]; then
            sed -i 's|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.7.3|g' android/build.gradle
          fi
          if [ -f "android/build.gradle.kts" ]; then
            sed -i 's|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.7.3|g' android/build.gradle.kts
            sed -i 's|id("com.android.application") version "[0-9.]*"|id("com.android.application") version "8.7.3"|g' android/build.gradle.kts 2>/dev/null || true
          fi

          if [ -f "android/app/build.gradle" ]; then
            grep -q "namespace" android/app/build.gradle || sed -i '/android {/a\    namespace "com.example.app"' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            grep -q "namespace" android/app/build.gradle.kts || sed -i '/android {/a\    namespace("com.example.app")' android/app/build.gradle.kts
          fi

          if [ -f "android/gradle.properties" ]; then
            grep -q "android.useAndroidX" android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
            grep -q "android.enableJetifier" android/gradle.properties || echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          [ -f "android/gradlew" ] && chmod +x android/gradlew || true

      - name: Build APK (Debug)
        if: github.event.inputs.build_type == 'debug' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: flutter build apk --debug --target-platform android-arm,android-arm64

      - name: Build APK (Release / Generic)
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'generic') && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Web2APK Build
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          if [ -f web2apk/web2apk ]; then
            ./web2apk/web2apk \
              --url "${{ github.event.inputs.url }}" \
              --name "${{ github.event.inputs.app_name }}" \
              --package "${{ github.event.inputs.package_name }}" \
              --icon "${{ github.event.inputs.icon_url }}" \
              --output webapp.apk || echo "Web2APK failed"
          else
            echo "Web2APK binary missing"
            touch webapp.apk
          fi
        continue-on-error: true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            project/build/app/outputs/flutter-apk/*.apk
            webapp.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -rf project web2apk webapp.apk project.zip || true
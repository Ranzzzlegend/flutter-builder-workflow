name: Flutter Build & Web2APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build (debug, release, web2apk, generic)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - web2apk
          - generic
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name (untuk Flutter)'
        required: false
        default: 'com.example.app'
      source_zip_url:
        description: 'URL ZIP project Flutter'
        required: false
        default: ''
      url:
        description: 'URL Website (untuk web2apk)'
        required: false
        default: ''
      icon_url:
        description: 'URL Icon (untuk web2apk)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies (web2apk)
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk gradle
          wget -q -O web2apk.zip https://github.com/GoogleChromeLabs/web2apk/releases/latest/download/web2apk.zip
          unzip web2apk.zip -d web2apk
          chmod +x web2apk/web2apk

      - name: Download Flutter project ZIP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          wget -O project.zip "${{ github.event.inputs.source_zip_url }}"
          unzip project.zip -d project
          ls -la project/

      - name: Get Flutter dependencies
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: flutter pub get

      # ===== PERBAIKAN: Upgrade dependencies otomatis =====
      - name: Upgrade dependencies (fix compatibility issues)
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "📦 Mengecek dan mengupgrade dependencies yang bermasalah..."
          
          # Cek apakah ada font_awesome_flutter di pubspec.yaml
          if grep -q "font_awesome_flutter" pubspec.yaml; then
            echo "🔧 Mengupgrade font_awesome_flutter ke versi terbaru..."
            sed -i 's|font_awesome_flutter: [^,]*|font_awesome_flutter: ^10.10.0|g' pubspec.yaml
            sed -i 's|font_awesome_flutter:.*|font_awesome_flutter: ^10.10.0|g' pubspec.yaml
          fi
          
          # Upgrade semua dependencies
          flutter pub upgrade
          flutter pub get

      # ===== PERBAIKAN: Upgrade Gradle ke 8.11.1 =====
      - name: Upgrade Gradle wrapper & AGP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "📦 Mengupgrade Gradle ke versi 8.11.1..."
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
            cat android/gradle/wrapper/gradle-wrapper.properties
          else
            echo "⚠️ File gradle-wrapper.properties tidak ditemukan, melewati upgrade..."
          fi

          if [ -f "android/build.gradle" ]; then
            echo "📦 Mengupdate AGP ke 8.5.2..."
            sed -i 's|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.5.2|g' android/build.gradle
          fi
          if [ -f "android/build.gradle.kts" ]; then
            echo "📦 Mengupdate AGP ke 8.5.2 (kts)..."
            sed -i 's|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.5.2|g' android/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            grep -q "namespace" android/app/build.gradle || sed -i '/android {/a\    namespace "com.example.app"' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            grep -q "namespace" android/app/build.gradle.kts || sed -i '/android {/a\    namespace("com.example.app")' android/app/build.gradle.kts
          fi

          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build APK (Debug)
        if: github.event.inputs.build_type == 'debug' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter build apk --debug --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Build APK (Release)
        if: github.event.inputs.build_type == 'release' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          # Coba build, jika gagal karena font_awesome_flutter, coba solusi alternatif
          flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation || \
          (echo "⚠️ Build gagal, mencoba dengan dependency override..." && \
           echo "📦 Menambahkan dependency override untuk font_awesome_flutter..." && \
           echo "dependency_overrides:" >> pubspec.yaml && \
           echo "  font_awesome_flutter: ^10.10.0" >> pubspec.yaml && \
           flutter pub get && \
           flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation) || \
          (echo "⚠️ Gagal dengan override, mencoba downgrade Flutter..." && \
           flutter downgrade 3.22.0 && \
           flutter pub get && \
           flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation)

      - name: Build APK (Generic)
        if: github.event.inputs.build_type == 'generic' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation || \
          (echo "📦 Menambahkan dependency override..." && \
           echo "dependency_overrides:" >> pubspec.yaml && \
           echo "  font_awesome_flutter: ^10.10.0" >> pubspec.yaml && \
           flutter pub get && \
           flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation)

      - name: Web2APK Build
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          ./web2apk/web2apk \
            --url "${{ github.event.inputs.url }}" \
            --name "${{ github.event.inputs.app_name }}" \
            --package "com.webapp.${{ github.event.inputs.app_name }}" \
            --icon "${{ github.event.inputs.icon_url }}" \
            --output webapp.apk
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            project/build/app/outputs/flutter-apk/*.apk
            webapp.apk
          retention-days: 7

      - name: Cleanup
        run: rm -rf project web2apk webapp.apk || true
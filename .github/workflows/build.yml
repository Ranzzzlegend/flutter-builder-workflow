name: Flutter Build & Web2APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build (debug, release, web2apk, generic)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - web2apk
          - generic
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name (untuk Flutter)'
        required: false
        default: 'com.example.app'
      source_zip_url:
        description: 'URL ZIP project Flutter'
        required: false
        default: ''
      url:
        description: 'URL Website (untuk web2apk)'
        required: false
        default: ''
      icon_url:
        description: 'URL Icon (untuk web2apk)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ========== WEB2APK PATH ==========
      - name: Install dependencies (web2apk)
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip gradle
          wget -q -O web2apk.zip https://github.com/GoogleChromeLabs/web2apk/releases/latest/download/web2apk.zip || echo "skip"
          if [ -f web2apk.zip ]; then unzip -o web2apk.zip -d web2apk; chmod +x web2apk/web2apk || true; fi

      - name: Web2APK Build
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          if [ -f web2apk/web2apk ]; then
            ./web2apk/web2apk \
              --url "${{ github.event.inputs.url }}" \
              --name "${{ github.event.inputs.app_name }}" \
              --package "${{ github.event.inputs.package_name }}" \
              --icon "${{ github.event.inputs.icon_url }}" \
              --output webapp.apk || echo "Web2APK failed"
          else
            echo "Web2APK binary missing"
            touch webapp.apk
          fi
        continue-on-error: true

      # ========== FLUTTER BUILD PATH ==========
      - name: Download Flutter project ZIP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          wget -O project.zip "${{ github.event.inputs.source_zip_url }}"
          mkdir -p project
          unzip -o project.zip -d project > /dev/null
          if [ ! -f "project/pubspec.yaml" ]; then
            SUB=$(find project -maxdepth 3 -name pubspec.yaml -type f | head -1 | xargs dirname 2>/dev/null)
            if [ -n "$SUB" ] && [ "$SUB" != "project" ]; then
              shopt -s dotglob
              mv "$SUB"/* project/ 2>/dev/null || true
              shopt -u dotglob
            fi
          fi
          echo "=== Project folder ==="
          ls -la project/
          echo ""
          echo "=== pubspec.yaml ==="
          cat project/pubspec.yaml || true

      # ===== STEP 1: AUTO-DETECT Flutter version dari pubspec =====
      - name: Detect Flutter version from pubspec
        id: detect
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          if [ ! -f "project/pubspec.yaml" ]; then
            echo "flutter_version=3.29.3" >> $GITHUB_OUTPUT
            exit 0
          fi

          SDK=$(grep -E '^\s+sdk:' project/pubspec.yaml | head -1 | sed 's/.*sdk:\s*//' | tr -d '"' | tr -d "'" | tr -d ' ')
          echo "SDK constraint dari pubspec: $SDK"

          MIN=$(echo "$SDK" | grep -oE '>=?[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 | sed 's/>=//;s/>//')
          if [ -z "$MIN" ]; then MIN="3.5.0"; fi
          echo "Min SDK version: $MIN"

          MAJOR=$(echo "$MIN" | cut -d. -f1)
          MINOR=$(echo "$MIN" | cut -d. -f2)

          FLUTTER="3.29.3"
          if [ "$MAJOR" -ge 4 ]; then FLUTTER="3.38.4"
          elif [ "$MAJOR" -eq 3 ]; then
            if [ "$MINOR" -ge 10 ]; then FLUTTER="3.38.4"
            elif [ "$MINOR" -ge 9 ]; then FLUTTER="3.35.4"
            elif [ "$MINOR" -ge 8 ]; then FLUTTER="3.32.8"
            elif [ "$MINOR" -ge 7 ]; then FLUTTER="3.29.3"
            elif [ "$MINOR" -ge 6 ]; then FLUTTER="3.27.4"
            elif [ "$MINOR" -ge 5 ]; then FLUTTER="3.24.5"
            else FLUTTER="3.22.3"
            fi
          fi

          echo "✅ Detected Flutter version: $FLUTTER"
          echo "flutter_version=$FLUTTER" >> $GITHUB_OUTPUT

      - name: Setup Flutter (detected: ${{ steps.detect.outputs.flutter_version }})
        id: setup1
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.detect.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Flutter doctor
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: flutter doctor -v

      - name: Show Flutter & pubspec info
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo ""
          echo "=== pubspec.yaml ==="
          cat project/pubspec.yaml

      # ===== STEP 2: PUB GET attempt 1 =====
      - name: Flutter pub get (attempt 1)
        id: pubget1
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        continue-on-error: true
        run: |
          flutter pub get 2>&1 | tee /tmp/pubget1.log
          exit ${PIPESTATUS[0]}

      # ===== STEP 3: SMART FALLBACK — analisis error =====
      - name: Analyze pub get failure & determine fallback
        id: fallback
        if: steps.pubget1.outcome == 'failure'
        run: |
          echo "⚠️ Pub get attempt 1 gagal. Menganalisis error..."
          LOG_FILE="/tmp/pubget1.log"
          if [ ! -f "$LOG_FILE" ]; then
            echo "flutter_version=3.35.4" >> $GITHUB_OUTPUT
            exit 0
          fi
          cat "$LOG_FILE"

          # Cari pola "requires SDK version ^X.Y.Z"
          REQUIRED=$(grep -oE "requires SDK version [><=^]*[0-9]+\.[0-9]+(\.[0-9]+)?" "$LOG_FILE" | head -1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)

          if [ -z "$REQUIRED" ]; then
            REQUIRED=$(grep -oE "sdk[:\s]+[><=^]*[0-9]+\.[0-9]+(\.[0-9]+)?" "$LOG_FILE" | head -1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          fi

          echo "Required Dart SDK dari error: $REQUIRED"

          if [ -z "$REQUIRED" ]; then
            echo "flutter_version=3.35.4" >> $GITHUB_OUTPUT
            exit 0
          fi

          MAJOR=$(echo "$REQUIRED" | cut -d. -f1)
          MINOR=$(echo "$REQUIRED" | cut -d. -f2)

          FLUTTER="3.38.4"
          if [ "$MAJOR" -ge 4 ]; then FLUTTER="3.38.4"
          elif [ "$MAJOR" -eq 3 ]; then
            if [ "$MINOR" -ge 10 ]; then FLUTTER="3.38.4"
            elif [ "$MINOR" -ge 9 ]; then FLUTTER="3.35.4"
            elif [ "$MINOR" -ge 8 ]; then FLUTTER="3.32.8"
            elif [ "$MINOR" -ge 7 ]; then FLUTTER="3.29.3"
            elif [ "$MINOR" -ge 6 ]; then FLUTTER="3.27.4"
            elif [ "$MINOR" -ge 5 ]; then FLUTTER="3.24.5"
            else FLUTTER="3.22.3"
            fi
          fi

          echo "✅ Fallback Flutter version: $FLUTTER"
          echo "flutter_version=$FLUTTER" >> $GITHUB_OUTPUT

      - name: Setup Flutter (fallback: ${{ steps.fallback.outputs.flutter_version }})
        id: setup2
        if: steps.pubget1.outcome == 'failure' && steps.fallback.outputs.flutter_version != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fallback.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Flutter pub get (attempt 2 — fallback)
        id: pubget2
        if: steps.setup2.outcome == 'success'
        working-directory: project
        continue-on-error: true
        run: |
          flutter pub get 2>&1 | tee /tmp/pubget2.log
          exit ${PIPESTATUS[0]}

      # ===== STEP 4: FINAL fallback ke 3.29.3 kalau masih gagal =====
      - name: Setup Flutter (final: 3.29.3)
        id: setup3
        if: steps.pubget1.outcome == 'failure' && steps.pubget2.outcome == 'failure'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Flutter pub get (attempt 3 — final 3.29.3)
        if: steps.setup3.outcome == 'success'
        working-directory: project
        run: flutter pub get

      # ===== STEP 5: GRADLE & AGP ADAPTIF =====
      - name: Setup Gradle & AGP (adaptive)
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          FLUTTER_VER=$(flutter --version 2>/dev/null | head -1 | awk '{print $2}')
          echo "Flutter version saat ini: $FLUTTER_VER"

          # Default aman (Flutter 3.28-3.32)
          GRADLE_VER="8.11.1"
          AGP_VER="8.7.3"

          FM=$(echo "$FLUTTER_VER" | cut -d. -f1)
          Fm=$(echo "$FLUTTER_VER" | cut -d. -f2)

          if [ "$FM" = "3" ]; then
            if [ "$Fm" -ge 33 ]; then
              GRADLE_VER="8.14.3"; AGP_VER="8.9.1"
            elif [ "$Fm" -ge 28 ]; then
              GRADLE_VER="8.11.1"; AGP_VER="8.7.3"
            elif [ "$Fm" -ge 25 ]; then
              GRADLE_VER="8.9"; AGP_VER="8.5.2"
            else
              GRADLE_VER="8.4"; AGP_VER="8.3.0"
            fi
          fi

          echo "📦 Menggunakan Gradle: $GRADLE_VER, AGP: $AGP_VER"

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i "s|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VER}-all.zip|g" android/gradle/wrapper/gradle-wrapper.properties
            cat android/gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f "android/build.gradle" ]; then
            sed -i "s|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:${AGP_VER}|g" android/build.gradle
          fi
          if [ -f "android/build.gradle.kts" ]; then
            sed -i "s|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:${AGP_VER}|g" android/build.gradle.kts
            sed -i "s|id(\"com.android.application\") version \"[0-9.]*\"|id(\"com.android.application\") version \"${AGP_VER}\"|g" android/build.gradle.kts 2>/dev/null || true
          fi

          if [ -f "android/app/build.gradle" ]; then
            grep -q "namespace" android/app/build.gradle || sed -i '/android {/a\    namespace "com.example.app"' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            grep -q "namespace" android/app/build.gradle.kts || sed -i '/android {/a\    namespace("com.example.app")' android/app/build.gradle.kts
          fi

          if [ -f "android/gradle.properties" ]; then
            grep -q "android.useAndroidX" android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
            grep -q "android.enableJetifier" android/gradle.properties || echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          [ -f "android/gradlew" ] && chmod +x android/gradlew || true

      - name: Build APK (Debug)
        if: github.event.inputs.build_type == 'debug' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: flutter build apk --debug --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Build APK (Release / Generic)
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'generic') && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            project/build/app/outputs/flutter-apk/*.apk
            webapp.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -rf project web2apk webapp.apk project.zip || true
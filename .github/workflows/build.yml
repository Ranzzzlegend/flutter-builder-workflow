import sys
try:
    with open('pubspec.yaml', 'r') as f:
        content = f.read()
    lines = content.split('\n')
    new_lines = []
    in_dep_overrides = False
    for line in lines:
        if line.strip() == 'dependency_overrides:':
            in_dep_overrides = True
            continue
        if in_dep_overrides and (line.startswith('  ') or line.strip() == ''):
            continue
        if in_dep_overrides and not line.startswith('  '):
            in_dep_overrides = False
        new_lines.append(line)
    content = '\n'.join(new_lines)
    content += """

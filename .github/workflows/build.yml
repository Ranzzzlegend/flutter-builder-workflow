name: Flutter Build and Web2APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - web2apk
          - generic
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.example.app'
      source_zip_url:
        description: 'URL ZIP project'
        required: false
        default: ''
      url:
        description: 'URL Website'
        required: false
        default: ''
      icon_url:
        description: 'URL Icon'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ========== WEB2APK PATH ==========
      - name: Install web2apk dependencies
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip gradle
          wget -q -O web2apk.zip https://github.com/GoogleChromeLabs/web2apk/releases/latest/download/web2apk.zip || echo "skip"
          if [ -f web2apk.zip ]; then unzip -o web2apk.zip -d web2apk; chmod +x web2apk/web2apk || true; fi

      - name: Web2APK Build
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          if [ -f web2apk/web2apk ]; then
            ./web2apk/web2apk --url "${{ github.event.inputs.url }}" --name "${{ github.event.inputs.app_name }}" --package "${{ github.event.inputs.package_name }}" --icon "${{ github.event.inputs.icon_url }}" --output webapp.apk || echo "web2apk failed"
          else
            echo "web2apk binary missing"
            touch webapp.apk
          fi
        continue-on-error: true

      # ========== FLUTTER BUILD PATH ==========
      - name: Download Flutter project ZIP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          wget -O project.zip "${{ github.event.inputs.source_zip_url }}"
          mkdir -p project
          unzip -o project.zip -d project > /dev/null
          if [ ! -f "project/pubspec.yaml" ]; then
            SUB=$(find project -maxdepth 3 -name pubspec.yaml -type f | head -1 | xargs dirname 2>/dev/null)
            if [ -n "$SUB" ] && [ "$SUB" != "project" ]; then
              shopt -s dotglob
              mv "$SUB"/* project/ 2>/dev/null || true
              shopt -u dotglob
            fi
          fi

      # ========== STEP 1: SMART PATCH PUBSPEC.YAML ==========
      - name: Smart Patch pubspec.yaml
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 Melakukan Smart Patch pada pubspec.yaml..."
          python3 - << 'PYEOF'
          import re
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          if 'environment:' in content:
              content = re.sub(r'(environment:\s*\n\s+sdk:).*', r'\1 ">=3.0.0 <4.0.0"', content)
          else:
              content += '\nenvironment:\n  sdk: ">=3.0.0 <4.0.0"\n'
          content = re.sub(r'(flutter_test:\s*\n\s+sdk:).*', r'\1 flutter', content)
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          print("✅ pubspec.yaml berhasil dipatch dengan aman.")
          PYEOF

      # ========== STEP 2: TOTAL REPLACEMENT GRADLE (GROOVY TO KOTLIN) ==========
      - name: Fix All Android Gradle Files & XML Names
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 Memperbaiki total semua file Gradle dan Resource XML..."
          
          # --- AUTO-FIX NAMA FILE XML YANG SALAH ---
          if [ -f "android/app/src/main/res/xml/accessibility_service.config.xml" ]; then
            mv "android/app/src/main/res/xml/accessibility_service.config.xml" "android/app/src/main/res/xml/accessibility_service_config.xml"
            echo "✅ BERHASIL MEMPERBAIKI NAMA FILE XML (Titik diubah menjadi Garis Bawah)"
          fi
          
          # Ambil nama package dari AndroidManifest agar tidak error
          PKG_NAME=$(grep -o 'package="[^"]*"' android/app/src/main/AndroidManifest.xml | head -1 | sed 's/package="//g' | sed 's/"//g' || echo "com.example.vanta")
          if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.vanta"; fi
          echo "📦 Menggunakan Package Name: $PKG_NAME"

          # 1. Fix settings.gradle.kts
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
          }
          include(":app")
          EOF

          # 2. Fix root build.gradle.kts
          cat > android/build.gradle.kts << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
              }
          }
          val newBuildDir: Directory = rootProject.layout.buildDirectory.dir("../../build").get()
          rootProject.layout.buildDirectory.value(newBuildDir)
          subprojects {
              val newSubprojectBuildDir: Directory = newBuildDir.dir(project.name)
              project.layout.buildDirectory.value(newSubprojectBuildDir)
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }
          tasks.register<Delete>("clean") {
              delete(rootProject.layout.buildDirectory)
          }
          EOF

          # 3. Fix app/build.gradle.kts (PASTIKAN minSdk = 24)
          cat > android/app/build.gradle.kts << EOF
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          android {
              namespace = "$PKG_NAME"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              defaultConfig {
                  applicationId = "$PKG_NAME"
                  minSdk = 24 // <--- WAJIB 24 UNTUK AKSESIBILITAS
                  targetSdk = flutter.targetSdkVersion
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          flutter {
              source = "../.."
          }
          EOF
          
          # Hapus file Groovy jika ada agar tidak bentrok
          rm -f android/app/build.gradle
          rm -f android/build.gradle
          rm -f android/settings.gradle

      # ========== STEP 3: SETUP FLUTTER ==========
      - name: Setup Flutter Fixed Version
        id: s1
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        if: steps.s1.outcome == 'success'
        run: flutter --version

      # ========== STEP 4: PUB GET ==========
      - name: Pub get
        if: steps.s1.outcome == 'success'
        working-directory: project
        run: flutter pub get

      # ========== STEP 5: INSTALL GRADLE GLOBAL ==========
      - name: Install Gradle 8.14.3 Globally
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != '' && steps.s1.outcome == 'success'
        run: |
          echo "🔧 Menginstall Gradle 8.14.3..."
          cd /tmp
          wget -q "https://services.gradle.org/distributions/gradle-8.14.3-bin.zip" -O gradle.zip
          unzip -q gradle.zip
          sudo mkdir -p /opt/gradle
          sudo mv gradle-8.14.3 /opt/gradle/
          sudo chmod -R 755 /opt/gradle/gradle-8.14.3/
          sudo chmod +x /opt/gradle/gradle-8.14.3/bin/gradle
          /opt/gradle/gradle-8.14.3/bin/gradle --version

      # ========== STEP 6: OVERRIDE GRADLEW ==========
      - name: Override gradlew
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != '' && steps.s1.outcome == 'success'
        working-directory: project
        run: |
          echo "🔧 Mengganti gradlew..."
          cat > android/gradlew << 'GRADLEW_EOF'
          #!/bin/bash
          exec /opt/gradle/gradle-8.14.3/bin/gradle "$@"
          GRADLEW_EOF
          chmod +x android/gradlew

      # ========== STEP 7: BUILD APK ==========
      - name: Build APK Debug
        if: github.event.inputs.build_type == 'debug' && github.event.inputs.source_zip_url != '' && steps.s1.outcome == 'success'
        working-directory: project
        run: flutter build apk --debug --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Build APK Release
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'generic') && github.event.inputs.source_zip_url != '' && steps.s1.outcome == 'success'
        working-directory: project
        run: flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      # ========== STEP 8: UPLOAD ==========
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            project/build/app/outputs/flutter-apk/*.apk
            webapp.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -rf project web2apk webapp.apk project.zip /tmp/gradle* || true
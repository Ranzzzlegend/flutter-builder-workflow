name: Flutter Build

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.4'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=${PWD}/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${PWD}/android-sdk" >> $GITHUB_ENV
          echo "PATH=${PWD}/android-sdk/cmdline-tools/latest/bin:${PATH}" >> $GITHUB_ENV
          echo "PATH=${PWD}/android-sdk/platform-tools:${PATH}" >> $GITHUB_ENV

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build APK
        run: |
          flutter create --org com.example --project-name myapp
          cd myapp
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: myapp/build/app/outputs/flutter-apk/app-release.apk
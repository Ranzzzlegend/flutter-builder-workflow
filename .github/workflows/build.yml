name: Flutter Build & Web2APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build (debug, release, web2apk, generic)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - web2apk
          - generic
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name (untuk Flutter)'
        required: false
        default: 'com.example.app'
      source_zip_url:
        description: 'URL ZIP project Flutter'
        required: false
        default: ''
      url:
        description: 'URL Website (untuk web2apk)'
        required: false
        default: ''
      icon_url:
        description: 'URL Icon (untuk web2apk)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.22.0
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies (web2apk)
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk gradle
          wget -q -O web2apk.zip https://github.com/GoogleChromeLabs/web2apk/releases/latest/download/web2apk.zip
          unzip web2apk.zip -d web2apk
          chmod +x web2apk/web2apk

      - name: Download Flutter project ZIP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          wget -O project.zip "${{ github.event.inputs.source_zip_url }}"
          unzip project.zip -d project
          ls -la project/

      # ================================================================
      # PERBAIKAN 1: Fix pubspec.yaml (dependency overrides)
      # ================================================================
      - name: Fix pubspec.yaml (AUTO-FIX)
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 MEMPERBAIKI pubspec.yaml..."
          cp pubspec.yaml pubspec.yaml.bak
          
          # Hapus dependency_overrides yang mungkin ada sebelumnya
          sed -i '/dependency_overrides:/d' pubspec.yaml
          sed -i '/^  flutter_lints:/d' pubspec.yaml
          sed -i '/^  font_awesome_flutter:/d' pubspec.yaml
          sed -i '/^  package_info_plus:/d' pubspec.yaml
          sed -i '/^  share_plus:/d' pubspec.yaml
          sed -i '/^  web:/d' pubspec.yaml
          sed -i '/^  youtube_player_flutter:/d' pubspec.yaml
          sed -i '/^  flutter_inappwebview:/d' pubspec.yaml
          sed -i '/^  intl:/d' pubspec.yaml
          sed -i '/^  http:/d' pubspec.yaml
          sed -i '/^  path_provider:/d' pubspec.yaml
          sed -i '/^  shared_preferences:/d' pubspec.yaml
          sed -i '/^  sqflite:/d' pubspec.yaml
          
          # Tambahkan dependency_overrides dengan versi stabil
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  flutter_lints: ^4.0.0" >> pubspec.yaml
          echo "  font_awesome_flutter: ^10.6.0" >> pubspec.yaml
          echo "  package_info_plus: ^5.0.0" >> pubspec.yaml
          echo "  share_plus: ^10.0.0" >> pubspec.yaml
          echo "  web: ^0.5.0" >> pubspec.yaml
          echo "  flutter_inappwebview: ^5.7.0" >> pubspec.yaml
          echo "  youtube_player_flutter: ^8.1.0" >> pubspec.yaml
          echo "  intl: ^0.19.0" >> pubspec.yaml
          echo "  http: ^1.2.2" >> pubspec.yaml
          echo "  path_provider: ^2.1.3" >> pubspec.yaml
          echo "  shared_preferences: ^2.2.3" >> pubspec.yaml
          echo "  sqflite: ^2.3.3" >> pubspec.yaml

      # ================================================================
      # PERBAIKAN 2: Auto-fix Dart source code (FontAwesomeIcons)
      # ================================================================
      - name: Auto-fix Dart source code errors
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 MEMPERBAIKI SOURCE CODE..."
          for file in lib/*.dart; do
            if [ -f "$file" ]; then
              sed -i 's/FontAwesomeIcons\.userEdit/Icons.edit/g' "$file"
              sed -i 's/FontAwesomeIcons\.calendarPlus/Icons.calendar_today/g' "$file"
              sed -i 's/FontAwesomeIcons\.calendarDay/Icons.calendar_month/g' "$file"
              sed -i 's/FontAwesomeIcons\.clock/Icons.timer/g' "$file"
              sed -i 's/FontAwesomeIcons\.users/Icons.people/g' "$file"
              sed -i 's/FontAwesomeIcons\.userPlus/Icons.person_add/g' "$file"
              sed -i 's/FontAwesomeIcons\.userSlash/Icons.person_remove/g' "$file"
              sed -i 's/FontAwesomeIcons\.user/Icons.person/g' "$file"
              sed -i 's/FontAwesomeIcons\.lock/Icons.lock/g' "$file"
              sed -i 's/FontAwesomeIcons\.whatsapp/Icons.whatsapp/g' "$file"
              sed -i 's/FontAwesomeIcons\.telegram/Icons.telegram/g' "$file"
              sed -i 's/FontAwesomeIcons\.tiktok/Icons.music_note/g' "$file"
              sed -i 's/FontAwesomeIcons\.rocket/Icons.rocket_launch/g' "$file"
              sed -i 's/FontAwesomeIcons\.userAstronaut/Icons.person/g' "$file"
            fi
          done

      # ================================================================
      # PERBAIKAN 3: Fix build.gradle.kts (KOTLIN DSL - TAMBAHKAN KURUNG)
      # ================================================================
      - name: Fix build.gradle.kts (FIX KOTLIN DSL - ADD PARENTHESES)
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 MEMPERBAIKI build.gradle.kts..."
          
          # ============================================================
          # Fix android/app/build.gradle.kts
          # ============================================================
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "📦 Memperbaiki android/app/build.gradle.kts..."
            cp android/app/build.gradle.kts android/app/build.gradle.kts.bak
            
            # Tampilkan isi sebelum perbaikan (debug)
            echo "📄 android/app/build.gradle.kts SEBELUM perbaikan:"
            grep -A 10 "defaultConfig" android/app/build.gradle.kts || cat android/app/build.gradle.kts | head -30
            
            # --- PERBAIKAN UTAMA: ganti semua flutter.versionCode menjadi flutter.versionCode() ---
            # Gunakan sed dengan batas kata (\b) untuk menghindari penggantian sebagian
            sed -i 's/flutter\.versionCode\b/flutter.versionCode()/g' android/app/build.gradle.kts
            sed -i 's/flutter\.versionName\b/flutter.versionName()/g' android/app/build.gradle.kts
            
            # Hapus kemungkinan kurung ganda yang terbentuk (misal versionCode()())
            sed -i 's/flutter\.versionCode()()/flutter.versionCode()/g' android/app/build.gradle.kts
            sed -i 's/flutter\.versionName()()/flutter.versionName()/g' android/app/build.gradle.kts
            
            # Jika masih ada baris yang menggunakan versionCode = flutter.versionCode (tanpa kurung) 
            # tapi tidak tertangkap karena spasi, kita tambahkan perbaikan manual:
            sed -i 's/versionCode = flutter\.versionCode\b/versionCode = flutter.versionCode()/g' android/app/build.gradle.kts
            sed -i 's/versionName = flutter\.versionName\b/versionName = flutter.versionName()/g' android/app/build.gradle.kts
            
            # --- PERBAIKAN ALTERNATIF: jika masih error, gunakan localProperties ---
            # Cek apakah masih ada sintaks yang salah dengan mencoba kompilasi ringan
            # Kita tidak bisa kompilasi di sini, tapi kita bisa tambahkan fallback dengan menimpa defaultConfig
            # Kita tambahkan blok kode yang membaca localProperties jika diperlukan.
            # Namun kita akan memasukkan kode standar Flutter Kotlin DSL di atas file.
            # Kita akan tambahkan di awal file:
            # val localProperties = Properties() ...
            # Lalu di defaultConfig gunakan versionCode = flutterVersionCode.toInt()
            # Tapi ini radikal, jadi kita hanya lakukan jika metode kurung gagal.
            
            # Tampilkan isi setelah perbaikan
            echo "📄 android/app/build.gradle.kts SETELAH perbaikan:"
            grep -A 10 "defaultConfig" android/app/build.gradle.kts || cat android/app/build.gradle.kts | head -30
          fi
          
          # ============================================================
          # Fix android/build.gradle.kts (Gradle plugin version)
          # ============================================================
          if [ -f "android/build.gradle.kts" ]; then
            echo "📦 Memperbaiki android/build.gradle.kts..."
            sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.5.2/g' android/build.gradle.kts
          fi

      # ================================================================
      # PERBAIKAN 4: Upgrade Gradle wrapper
      # ================================================================
      - name: Upgrade Gradle wrapper
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      # ================================================================
      # PERBAIKAN 5: Get dependencies (dengan retry)
      # ================================================================
      - name: Get Flutter dependencies
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter pub get --no-example || (rm -f pubspec.lock && flutter pub get --no-example)

      # ================================================================
      # PERBAIKAN 6: Build APK
      # ================================================================
      - name: Build APK (Release)
        if: github.event.inputs.build_type == 'release' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Build APK (Debug)
        if: github.event.inputs.build_type == 'debug' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter build apk --debug --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Build APK (Generic)
        if: github.event.inputs.build_type == 'generic' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      # ================================================================
      # Upload artifact APK
      # ================================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            project/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Cleanup
        run: rm -rf project web2apk webapp.apk || true
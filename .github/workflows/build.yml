name: Flutter Build & Web2APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build (debug, release, web2apk, generic)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - web2apk
          - generic
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name (untuk Flutter)'
        required: false
        default: 'com.example.app'
      source_zip_url:
        description: 'URL ZIP project Flutter'
        required: false
        default: ''
      url:
        description: 'URL Website (untuk web2apk)'
        required: false
        default: ''
      icon_url:
        description: 'URL Icon (untuk web2apk)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===== PERBAIKAN: Gunakan Flutter 3.22.0 (stabil & kompatibel) =====
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.22.0
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies (web2apk)
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk gradle
          wget -q -O web2apk.zip https://github.com/GoogleChromeLabs/web2apk/releases/latest/download/web2apk.zip
          unzip web2apk.zip -d web2apk
          chmod +x web2apk/web2apk

      - name: Download Flutter project ZIP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        run: |
          wget -O project.zip "${{ github.event.inputs.source_zip_url }}"
          unzip project.zip -d project
          ls -la project/

      # ===== PERBAIKAN: Fix pubspec.yaml =====
      - name: Fix pubspec.yaml
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 Membersihkan pubspec.yaml..."
          
          # Backup
          cp pubspec.yaml pubspec.yaml.bak
          
          # Hapus dependency_overrides yang salah
          sed -i '/dependency_overrides:/d' pubspec.yaml
          sed -i 's/dependency_overrides://g' pubspec.yaml
          
          # Hapus baris kosong ganda
          sed -i '/^$/d' pubspec.yaml
          
          # Gunakan font_awesome_flutter versi yang kompatibel
          sed -i 's|font_awesome_flutter:.*|font_awesome_flutter: ^10.6.0|g' pubspec.yaml
          
          # Tambahkan dependency_overrides dengan benar
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  font_awesome_flutter: ^10.6.0" >> pubspec.yaml
          
          echo "📄 pubspec.yaml setelah perbaikan:"
          cat pubspec.yaml

      # ===== PERBAIKAN: Auto-fix source code errors =====
      - name: Auto-fix Dart source code errors
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          echo "🔧 Memperbaiki source code Dart..."
          
          # 1. Fix owner_page.dart - FontAwesomeIcons.userEdit
          if [ -f "lib/owner_page.dart" ]; then
            echo "📦 Memperbaiki owner_page.dart..."
            sed -i 's/FontAwesomeIcons\.userEdit/Icons.edit/g' lib/owner_page.dart
            sed -i 's/FontAwesomeIcons\.calendarPlus/Icons.calendar_today/g' lib/owner_page.dart
            sed -i 's/FontAwesomeIcons\.clock/Icons.timer/g' lib/owner_page.dart
            sed -i 's/FontAwesomeIcons\.users/Icons.people/g' lib/owner_page.dart
            sed -i 's/FontAwesomeIcons\.userPlus/Icons.person_add/g' lib/owner_page.dart
            sed -i 's/FontAwesomeIcons\.userSlash/Icons.person_remove/g' lib/owner_page.dart
            sed -i 's/FontAwesomeIcons\.userEdit/Icons.edit/g' lib/owner_page.dart
            sed -i 's/FontAwesomeIcons\.user/Icons.person/g' lib/owner_page.dart
            sed -i 's/FontAwesomeIcons\.lock/Icons.lock/g' lib/owner_page.dart
            sed -i 's/FontAwesomeIcons\.calendarDay/Icons.calendar_month/g' lib/owner_page.dart
          fi
          
          # 2. Fix landing.dart - FontAwesomeIcons.tiktok
          if [ -f "lib/landing.dart" ]; then
            echo "📦 Memperbaiki landing.dart..."
            sed -i 's/FontAwesomeIcons\.tiktok/Icons.music_note/g' lib/landing.dart
            sed -i 's/FontAwesomeIcons\.rocket/Icons.rocket_launch/g' lib/landing.dart
            sed -i 's/FontAwesomeIcons\.telegram/Icons.telegram/g' lib/landing.dart
          fi
          
          # 3. Fix bug_sender.dart - FontAwesomeIcons.whatsapp
          if [ -f "lib/bug_sender.dart" ]; then
            echo "📦 Memperbaiki bug_sender.dart..."
            sed -i 's/FontAwesomeIcons\.whatsapp/Icons.whatsapp/g' lib/bug_sender.dart
            sed -i 's/FontAwesomeIcons\.userSlash/Icons.person_remove/g' lib/bug_sender.dart
            sed -i 's/FontAwesomeIcons\.userPlus/Icons.person_add/g' lib/bug_sender.dart
            sed -i 's/FontAwesomeIcons\.user/Icons.person/g' lib/bug_sender.dart
            sed -i 's/FontAwesomeIcons\.lock/Icons.lock/g' lib/bug_sender.dart
            sed -i 's/FontAwesomeIcons\.calendarDay/Icons.calendar_month/g' lib/bug_sender.dart
            sed -i 's/FontAwesomeIcons\.calendarPlus/Icons.calendar_today/g' lib/bug_sender.dart
            sed -i 's/FontAwesomeIcons\.clock/Icons.timer/g' lib/bug_sender.dart
            sed -i 's/FontAwesomeIcons\.users/Icons.people/g' lib/bug_sender.dart
          fi
          
          # 4. Fix profile_page.dart - FontAwesomeIcons.userAstronaut
          if [ -f "lib/profile_page.dart" ]; then
            echo "📦 Memperbaiki profile_page.dart..."
            sed -i 's/FontAwesomeIcons\.userAstronaut/Icons.person/g' lib/profile_page.dart
            sed -i 's/FontAwesomeIcons\.user/Icons.person/g' lib/profile_page.dart
          fi
          
          # 5. Fix admin_page.dart
          if [ -f "lib/admin_page.dart" ]; then
            echo "📦 Memperbaiki admin_page.dart..."
            sed -i 's/FontAwesomeIcons\.userSlash/Icons.person_remove/g' lib/admin_page.dart
            sed -i 's/FontAwesomeIcons\.userPlus/Icons.person_add/g' lib/admin_page.dart
            sed -i 's/FontAwesomeIcons\.user/Icons.person/g' lib/admin_page.dart
            sed -i 's/FontAwesomeIcons\.lock/Icons.lock/g' lib/admin_page.dart
            sed -i 's/FontAwesomeIcons\.calendarDay/Icons.calendar_month/g' lib/admin_page.dart
            sed -i 's/FontAwesomeIcons\.users/Icons.people/g' lib/admin_page.dart
            sed -i 's/FontAwesomeIcons\.whatsapp/Icons.whatsapp/g' lib/admin_page.dart
          fi
          
          # 6. Fix seller_page.dart
          if [ -f "lib/seller_page.dart" ]; then
            echo "📦 Memperbaiki seller_page.dart..."
            sed -i 's/FontAwesomeIcons\.userPlus/Icons.person_add/g' lib/seller_page.dart
            sed -i 's/FontAwesomeIcons\.user/Icons.person/g' lib/seller_page.dart
            sed -i 's/FontAwesomeIcons\.lock/Icons.lock/g' lib/seller_page.dart
            sed -i 's/FontAwesomeIcons\.calendarDay/Icons.calendar_month/g' lib/seller_page.dart
            sed -i 's/FontAwesomeIcons\.calendarPlus/Icons.calendar_today/g' lib/seller_page.dart
            sed -i 's/FontAwesomeIcons\.clock/Icons.timer/g' lib/seller_page.dart
            sed -i 's/FontAwesomeIcons\.users/Icons.people/g' lib/seller_page.dart
            sed -i 's/FontAwesomeIcons\.userEdit/Icons.edit/g' lib/seller_page.dart
          fi
          
          # 7. Fix riwayat_page.dart
          if [ -f "lib/riwayat_page.dart" ]; then
            echo "📦 Memperbaiki riwayat_page.dart..."
            sed -i 's/FontAwesomeIcons\.user/Icons.person/g' lib/riwayat_page.dart
          fi

          # 8. Fix cdrama_page.dart (jika ada FontAwesomeIcons)
          if [ -f "lib/cdrama_page.dart" ]; then
            echo "📦 Memperbaiki cdrama_page.dart..."
            sed -i 's/FontAwesomeIcons\.whatsapp/Icons.whatsapp/g' lib/cdrama_page.dart
            sed -i 's/FontAwesomeIcons\.telegram/Icons.telegram/g' lib/cdrama_page.dart
          fi

          # 9. Fix tools_gateway.dart
          if [ -f "lib/tools_gateway.dart" ]; then
            echo "📦 Memperbaiki tools_gateway.dart..."
            sed -i 's/FontAwesomeIcons\.user/Icons.person/g' lib/tools_gateway.dart
          fi
          
          echo "✅ Semua source code telah diperbaiki!"

      - name: Get Flutter dependencies
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter pub get || \
          (echo "⚠️ Gagal pub get, membersihkan cache..." && \
           flutter pub cache repair && \
           flutter pub get)

      # ===== PERBAIKAN: Upgrade Gradle =====
      - name: Upgrade Gradle wrapper & AGP
        if: github.event.inputs.build_type != 'web2apk' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "📦 Mengupgrade Gradle ke versi 8.11.1..."
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
            cat android/gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f "android/build.gradle" ]; then
            echo "📦 Mengupdate AGP ke 8.5.2..."
            sed -i 's|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.5.2|g' android/build.gradle
          fi
          if [ -f "android/build.gradle.kts" ]; then
            sed -i 's|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.5.2|g' android/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            grep -q "namespace" android/app/build.gradle || sed -i '/android {/a\    namespace "com.example.app"' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            grep -q "namespace" android/app/build.gradle.kts || sed -i '/android {/a\    namespace("com.example.app")' android/app/build.gradle.kts
          fi

          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build APK (Debug)
        if: github.event.inputs.build_type == 'debug' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter build apk --debug --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Build APK (Release)
        if: github.event.inputs.build_type == 'release' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Build APK (Generic)
        if: github.event.inputs.build_type == 'generic' && github.event.inputs.source_zip_url != ''
        working-directory: project
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Web2APK Build
        if: github.event.inputs.build_type == 'web2apk'
        run: |
          ./web2apk/web2apk \
            --url "${{ github.event.inputs.url }}" \
            --name "${{ github.event.inputs.app_name }}" \
            --package "com.webapp.${{ github.event.inputs.app_name }}" \
            --icon "${{ github.event.inputs.icon_url }}" \
            --output webapp.apk
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            project/build/app/outputs/flutter-apk/*.apk
            webapp.apk
          retention-days: 7

      - name: Cleanup
        run: rm -rf project web2apk webapp.apk || true
name: Telegram Notification

on:
  workflow_run:
    workflows: ["Flutter Build & Web2APK", "Auto Fix Build"]
    types: [completed]
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
    - name: Kirim status ke Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
          STATUS="✅ BERHASIL"
          COLOR="green"
        else
          STATUS="❌ GAGAL"
          COLOR="red"
        fi
        
        # Kirim pesan status
        curl -F "chat_id=$TELEGRAM_CHAT_ID" \
             -F "text=📊 STATUS BUILD\n\n📦 Workflow: ${{ github.event.workflow_run.name }}\n🏷️ Status: $STATUS\n🔢 Run: ${{ github.event.workflow_run.run_number }}\n\nSilakan cek log untuk detail" \
             "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"